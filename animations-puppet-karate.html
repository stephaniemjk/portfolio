  <body>
    <main class="page">
      <header class="site-header">
        <h1><a href="/">Stephanie M. Kim</a></h1>
        <nav class="nav-bar" aria-label="Primary">
        <a href="/">About</a>
        <a href="/design">Design</a>

      <article class="detail">
        <div>
          <p class="kicker">Animations</p>
          <h2>Puppet Karate</h2>
        </div>
        <div class="detail-video" style="width: min(100%, calc(80vh * 1080 / 1350))">
          <div class="vid" style="aspect-ratio: 1080 / 1350"><video src="/assets/video/puppet-karate.mp4" poster="/assets/img/puppet-karate-poster.webp" autoplay muted loop playsinline preload="metadata" aria-label="Puppet Karate"></video></div>
        </div>
        <a class="back-link" href="/animations">← Back to Animations</a>
      </article>
      <script>
        (function () {
          var boxes = [].slice.call(document.querySelectorAll('.vid'));
          boxes.forEach(function (box) {
            var v = box.querySelector('video'), b = box.querySelector('.vid-sound');
            if (!b) return;
            b.addEventListener('click', function () {
              v.muted = !v.muted;
              b.textContent = v.muted ? 'Sound on' : 'Sound off';
              b.setAttribute('aria-pressed', String(!v.muted));
              if (v.paused) v.play();
            });
          });
          if (!('IntersectionObserver' in window)) return;
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              var v = en.target;
              if (en.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
              else v.pause();
            });
          }, { threshold: 0.25 });
          boxes.forEach(function (box) { io.observe(box.querySelector('video')); });
        })();
      </script>
    </main>
  </body>
