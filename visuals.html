  <body>
    <main class="page">
      <header class="site-header">
        <h1><a href="/">Stephanie M. Kim</a></h1>
        <nav class="nav-bar" aria-label="Primary">
        <a href="/">About</a>
        <a class="is-active" aria-current="page" href="/visuals">Visuals</a>
        <a href="/interactive">Interactive Web</a>
        <a href="/film-writing">Film Writing</a>
        </nav>
      </header>

      <div class="visuals-cols">
        <section class="visuals-col" aria-labelledby="col-graphics">
          <h2 class="col-head" id="col-graphics">Graphics</h2>
          <div class="stack">
        <a class="gallery-tile" href="/designs-grid-de-sac">
          <div class="tile-media">
            <img src="/assets/img/grid-de-sac-thumb.webp" alt="Grid-de-Sac" loading="lazy" />
          </div>
          <div class="tile-text">
            <h2>Grid-de-Sac</h2>

        <a class="gallery-tile" href="/designs-chezkim">

            <img src="/assets/img/chez-kim-thumb.webp" alt="Chez Kim" loading="lazy" />

          <div class="tile-text">
            <h2>Chez Kim</h2>
          </div>
        </a>
        <a class="gallery-tile" href="/designs-publicspace">
          <div class="tile-media">
            <img src="/assets/img/public-space-thumb.webp" alt="Digital collage of a public plaza inspired by Cité Radieuse" loading="lazy" />
          </div>
          <div class="tile-text">
            <h2>Assembly at Radiant Square</h2>

          </div>

        <section class="visuals-col" aria-labelledby="col-animations">

        </div>
        <div class="gallery-tile">

            <iframe src="https://www.youtube-nocookie.com/embed/mzmz8qlgKCY" title="Le Train" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="tile-text">

          </div>
